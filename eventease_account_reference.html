
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FAF5F0;
  --card:#FFFFFF;
  --terra:#D4531A;
  --terra2:#E8622A;
  --terra-l:#FCEEE7;
  --terra-ll:#FFF5F0;
  --line:#EDE0D4;
  --line2:#F5EDE4;
  --txt:#1A0A00;
  --txt2:#5C3D2A;
  --txt3:#9E7B60;
  --green:#2E7D32;
  --greenl:#E8F5E9;
  --amber:#B45309;
  --amberl:#FEF3C7;
  --red:#C62828;
  --redl:#FFEBEE;
  --gold:#F59E0B;
}
body{font-family:'Poppins',sans-serif;background:#EDE0D4}

.outer{background:#EDE0D4;padding:16px;min-height:100vh}

.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.app-title{font-size:18px;font-weight:800;color:var(--txt);letter-spacing:-.02em}
.app-sub{font-size:11px;color:var(--txt3);margin-top:1px}

.screen-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:7px 14px;border-radius:30px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--txt3);transition:all .15s;white-space:nowrap;font-family:'Poppins',sans-serif}
.pill.active{background:var(--terra);color:#fff;border-color:var(--terra)}

.phones-row{display:flex;gap:20px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
.phones-row::-webkit-scrollbar{height:4px}
.phones-row::-webkit-scrollbar-thumb{background:var(--terra-l);border-radius:2px}

.phone-col{flex-shrink:0}
.phone-os-label{font-size:10px;font-weight:700;color:var(--txt3);text-align:center;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}

/* iOS frame */
.ios{
  width:340px;border-radius:50px;border:9px solid #1C1C1E;
  background:#1C1C1E;position:relative;overflow:hidden
}
.ios-notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:110px;height:30px;background:#1C1C1E;border-radius:0 0 20px 20px;
  z-index:20;display:flex;align-items:center;justify-content:center;gap:5px
}
.notch-pill{width:60px;height:11px;border-radius:6px;background:#000}
.notch-dot{width:11px;height:11px;border-radius:50%;background:#0a0a0a}
.ios-body{border-radius:42px;overflow:hidden;background:var(--bg)}

/* Android frame */
.android{
  width:340px;border-radius:34px;border:7px solid #252525;
  background:#252525;position:relative;overflow:hidden
}
.android-punch{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  width:12px;height:12px;border-radius:50%;background:#0a0a0a;z-index:20
}
.android-body{border-radius:28px;overflow:hidden;background:var(--bg)}

/* Status bars */
.status-ios{
  padding:14px 22px 6px;display:flex;justify-content:space-between;align-items:center;
  background:var(--bg);font-size:12px;font-weight:700;color:var(--txt2)
}
.status-android{
  padding:9px 16px 5px;display:flex;justify-content:space-between;align-items:center;
  background:var(--bg);font-size:11px;font-weight:700;color:var(--txt2)
}
.sig-bars{display:flex;gap:2px;align-items:flex-end}
.sig-bar{width:3px;border-radius:1px;background:var(--txt2)}

/* Scrollable content */
.phone-scroll{overflow-y:auto;max-height:620px;background:var(--bg)}
.phone-scroll::-webkit-scrollbar{width:0}

/* ─── SCREEN COMPONENTS ─── */

/* Top nav bar */
.navbar{
  display:flex;align-items:center;padding:10px 18px 14px;
  background:var(--bg);gap:10px;position:sticky;top:0;z-index:10
}
.nav-back{
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0
}
.nav-back-svg{width:16px;height:16px;stroke:var(--txt);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav-title{font-size:17px;font-weight:700;color:var(--txt);flex:1;text-align:center}
.nav-action{font-size:13px;font-weight:600;color:var(--terra);cursor:pointer}

/* Profile hero */
.profile-hero{background:var(--bg);padding:4px 20px 0}
.avatar-wrap{position:relative;width:82px;height:82px;margin:0 auto 12px}
.avatar-circle{
  width:82px;height:82px;border-radius:50%;background:var(--terra-l);
  border:3px solid var(--terra);display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:800;color:var(--terra);overflow:hidden
}
.avatar-img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.edit-badge{
  position:absolute;bottom:2px;right:2px;width:24px;height:24px;border-radius:50%;
  background:var(--terra);border:2px solid var(--bg);display:flex;align-items:center;
  justify-content:center;cursor:pointer
}
.verify-badge-wrap{
  position:absolute;top:0;right:-2px;width:22px;height:22px;border-radius:50%;
  background:var(--green);border:2px solid var(--bg);display:flex;align-items:center;
  justify-content:center
}
.prof-name{font-size:19px;font-weight:800;color:var(--txt);text-align:center;margin-bottom:3px}
.prof-info{font-size:12px;color:var(--txt3);text-align:center;margin-bottom:12px}
.stat-pills{display:flex;justify-content:center;gap:10px;margin-bottom:16px}
.stat-pill{
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:10px 14px;text-align:center;min-width:80px
}
.stat-num{font-size:18px;font-weight:800;color:var(--txt);display:block;margin-bottom:1px}
.stat-lbl{font-size:10px;color:var(--txt3);font-weight:500}

/* Section list */
.section-card{
  background:var(--card);border-radius:20px;margin:0 16px 12px;
  overflow:hidden;border:1px solid var(--line2)
}
.section-header{
  padding:14px 18px 6px;font-size:11px;font-weight:700;
  color:var(--txt3);letter-spacing:.06em;text-transform:uppercase
}
.row{
  display:flex;align-items:center;padding:13px 18px;gap:12px;
  border-bottom:1px solid var(--line2);cursor:pointer
}
.row:last-child{border-bottom:none}
.row-icon{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0
}
.row-text{flex:1}
.row-title{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:1px}
.row-sub{font-size:11px;color:var(--txt3)}
.row-right{display:flex;align-items:center;gap:6px}
.chevron-svg{width:16px;height:16px;stroke:var(--txt3);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.badge-pill{
  padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;
  letter-spacing:.03em;font-family:'Poppins',sans-serif
}
.badge-terra{background:var(--terra-l);color:var(--terra)}
.badge-green{background:var(--greenl);color:var(--green)}
.badge-amber{background:var(--amberl);color:var(--amber)}

/* Bottom nav */
.bottom-nav{
  background:var(--card);border-top:1px solid var(--line2);
  display:flex;padding:8px 0 12px;position:sticky;bottom:0
}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.bnav-lbl{font-size:10px;font-weight:600;color:var(--txt3);font-family:'Poppins',sans-serif}
.bnav-item.active .bnav-lbl{color:var(--terra)}
.bnav-dot{width:5px;height:5px;border-radius:50%;background:var(--terra);margin:0 auto}

/* Form elements */
.form-wrap{padding:0 16px}
.form-group{margin-bottom:14px}
.form-lbl{font-size:11px;font-weight:600;color:var(--txt3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;display:block}
.form-inp{
  width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);font-family:'Poppins',sans-serif;font-size:13px;
  color:var(--txt);font-weight:500
}
.form-inp.active{border-color:var(--terra);background:#fff}
.form-inp-row{display:flex;gap:8px}

/* CTA button */
.cta-btn{
  margin:6px 16px 16px;padding:16px;border-radius:30px;background:var(--terra);
  color:#fff;font-size:15px;font-weight:700;text-align:center;cursor:pointer;
  font-family:'Poppins',sans-serif;letter-spacing:.02em
}

/* Address cards */
.addr-card{
  background:var(--card);border-radius:16px;margin:0 16px 10px;
  border:1.5px solid var(--line2);overflow:hidden
}
.addr-head{display:flex;gap:10px;padding:14px;align-items:flex-start}
.addr-ico{
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;font-size:18px
}
.addr-info{flex:1}
.addr-title-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.addr-name{font-size:14px;font-weight:700;color:var(--txt)}
.addr-default{background:var(--greenl);color:var(--green);font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px}
.addr-txt{font-size:11px;color:var(--txt3);line-height:1.5}
.addr-actions{display:flex;border-top:1px solid var(--line2)}
.addr-act-btn{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:600;color:var(--terra);cursor:pointer;font-family:'Poppins',sans-serif}
.addr-act-btn+.addr-act-btn{border-left:1px solid var(--line2)}
.addr-act-btn.red{color:var(--red)}
.add-card{
  border:1.5px dashed var(--terra);border-radius:16px;margin:0 16px 10px;
  padding:16px;text-align:center;cursor:pointer;background:var(--terra-ll)
}

/* Payment cards */
.pay-card{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--line2);cursor:pointer
}
.pay-card:last-child{border-bottom:none}
.pay-logo{
  width:48px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;overflow:hidden
}
.pay-visa{background:#1A1F71;color:#fff}
.pay-upi{background:var(--terra-l);color:var(--terra);font-size:10px}
.pay-rupay{background:#138808;color:#fff;font-size:9px}
.pay-gpay{background:#fff;border:1px solid var(--line);font-size:9px;color:var(--txt2)}
.pay-info{flex:1}
.pay-name{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:2px}
.pay-sub{font-size:11px;color:var(--txt3)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.radio.on{border-color:var(--terra)}
.radio-dot{width:10px;height:10px;border-radius:50%;background:var(--terra)}

/* Notification items */
.notif-item{
  display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2);
  align-items:flex-start
}
.notif-item:last-child{border-bottom:none}
.notif-ico{
  width:40px;height:40px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0
}
.notif-body{flex:1}
.notif-title{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:3px}
.notif-msg{font-size:11px;color:var(--txt3);line-height:1.5}
.notif-time{font-size:10px;color:var(--txt3);margin-top:4px}
.unread-dot{width:9px;height:9px;border-radius:50%;background:var(--terra);flex-shrink:0;margin-top:4px}

/* Toggle */
.toggle-wrap{position:relative;width:44px;height:26px;flex-shrink:0;cursor:pointer}
.toggle-track{width:44px;height:26px;border-radius:13px;transition:background .2s}
.toggle-track.on{background:var(--terra)}
.toggle-track.off{background:var(--line)}
.toggle-thumb{
  position:absolute;top:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)
}
.toggle-thumb.on{left:21px}
.toggle-thumb.off{left:3px}

/* security score */
.sec-score{
  margin:14px 16px;background:var(--terra-l);border-radius:16px;
  padding:14px;border:1px solid rgba(212,83,26,.15)
}
.score-bar-bg{background:rgba(212,83,26,.15);border-radius:6px;height:8px;margin-top:8px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:6px;background:var(--terra)}

/* help */
.help-hero{
  margin:14px 16px;background:var(--card);border-radius:20px;
  padding:18px;text-align:center;border:1px solid var(--line2)
}
.search-bar{
  margin:10px 16px;background:var(--card);border-radius:30px;
  border:1.5px solid var(--line);padding:11px 16px;display:flex;
  align-items:center;gap:8px
}
.contact-row{display:flex;gap:10px;padding:0 16px;margin-bottom:14px}
.contact-btn{
  flex:1;background:var(--card);border:1.5px solid var(--line2);
  border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer
}
.faq-item{padding:13px 18px;border-bottom:1px solid var(--line2);cursor:pointer}
.faq-item:last-child{border-bottom:none}
.faq-q{font-size:13px;font-weight:600;color:var(--txt);display:flex;justify-content:space-between;align-items:center}
.faq-a{font-size:11px;color:var(--txt3);line-height:1.5;margin-top:6px}

.logout-row{
  display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer
}
.logout-ico{width:40px;height:40px;border-radius:12px;background:var(--redl);display:flex;align-items:center;justify-content:center}
.spacer{height:12px}
.version{text-align:center;font-size:10px;color:var(--txt3);padding:8px 0 16px;letter-spacing:.04em}

/* section divider */
.sdiv{height:8px;background:var(--terra-ll)}
</style>

<div class="outer">

<div class="top-row">
  <div>
    <div class="app-title">Account Section</div>
    <div class="app-sub" style="font-family:'Poppins',sans-serif">EventEase · iOS + Android · Warm palette</div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="pill active" id="sw-ios" onclick="setPlatform('ios')" style="font-family:'Poppins',sans-serif">iOS</button>
    <button class="pill" id="sw-and" onclick="setPlatform('android')" style="font-family:'Poppins',sans-serif">Android</button>
  </div>
</div>

<div class="screen-pills" id="screen-pills">
  <button class="pill active" onclick="setScreen('profile')" style="font-family:'Poppins',sans-serif">Profile</button>
  <button class="pill" onclick="setScreen('personal')" style="font-family:'Poppins',sans-serif">Personal Info</button>
  <button class="pill" onclick="setScreen('addresses')" style="font-family:'Poppins',sans-serif">Addresses</button>
  <button class="pill" onclick="setScreen('payments')" style="font-family:'Poppins',sans-serif">Payment Methods</button>
  <button class="pill" onclick="setScreen('notifications')" style="font-family:'Poppins',sans-serif">Notifications</button>
  <button class="pill" onclick="setScreen('security')" style="font-family:'Poppins',sans-serif">Security</button>
  <button class="pill" onclick="setScreen('help')" style="font-family:'Poppins',sans-serif">Help & Support</button>
</div>

<div class="phones-row">

  <!-- iOS -->
  <div class="phone-col" id="ios-col">
    <div class="phone-os-label" style="font-family:'Poppins',sans-serif">iOS · iPhone 15 Pro</div>
    <div class="ios">
      <div class="ios-notch"><div class="notch-pill"></div><div class="notch-dot"></div></div>
      <div class="ios-body">
        <div class="status-ios">
          <span style="font-family:'Poppins',sans-serif">10:09</span>
          <div style="display:flex;gap:5px;align-items:center">
            <div class="sig-bars">
              <div class="sig-bar" style="height:4px"></div>
              <div class="sig-bar" style="height:6px"></div>
              <div class="sig-bar" style="height:8px"></div>
              <div class="sig-bar" style="height:10px"></div>
            </div>
            <svg width="14" height="11" viewBox="0 0 14 11" fill="none"><path d="M7 2.2C9 .8 11.5 1 13 2.5" stroke="#5C3D2A" stroke-width="1.5" stroke-linecap="round"/><path d="M7 2.2C5 .8 2.5 1 1 2.5" stroke="#5C3D2A" stroke-width="1.5" stroke-linecap="round"/><path d="M7 5.5c.9-.7 2.1-.6 3 0" stroke="#5C3D2A" stroke-width="1.5" stroke-linecap="round"/><path d="M7 5.5c-.9-.7-2.1-.6-3 0" stroke="#5C3D2A" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="8.5" r="1.2" fill="#5C3D2A"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="#5C3D2A" stroke-opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#5C3D2A"/><path d="M23 4.5v3a1.5 1.5 0 000-3z" fill="#5C3D2A" fill-opacity=".4"/></svg>
          </div>
        </div>
        <div class="phone-scroll" id="ios-screen"></div>
      </div>
    </div>
  </div>

  <!-- Android -->
  <div class="phone-col" id="android-col" style="display:none">
    <div class="phone-os-label" style="font-family:'Poppins',sans-serif">Android · Pixel 8</div>
    <div class="android">
      <div class="android-punch"></div>
      <div class="android-body">
        <div class="status-android">
          <span style="font-family:'Poppins',sans-serif">10:09</span>
          <div style="display:flex;gap:4px;align-items:center">
            <div class="sig-bars">
              <div class="sig-bar" style="height:3px"></div>
              <div class="sig-bar" style="height:5px"></div>
              <div class="sig-bar" style="height:7px"></div>
              <div class="sig-bar" style="height:9px"></div>
            </div>
            <svg width="12" height="10" viewBox="0 0 14 11" fill="none"><path d="M7 2.2C9 .8 11.5 1 13 2.5" stroke="#5C3D2A" stroke-width="1.5" stroke-linecap="round"/><path d="M7 2.2C5 .8 2.5 1 1 2.5" stroke="#5C3D2A" stroke-width="1.5" stroke-linecap="round"/><path d="M7 5.5c.9-.7 2.1-.6 3 0" stroke="#5C3D2A" stroke-width="1.5" stroke-linecap="round"/><path d="M7 5.5c-.9-.7-2.1-.6-3 0" stroke="#5C3D2A" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="8.5" r="1.2" fill="#5C3D2A"/></svg>

</div>

<script>
let curPlatform = 'ios';
let curScreen = 'profile';

const chevronSvg = `<svg class="chevron-svg" viewBox="0 0 16 16"><polyline points="6 4 10 8 6 12"/></svg>`;
const editSvg = `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2l3 3-9 9H2v-3z"/></svg>`;
const checkSvg = `<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 6 5 9 10 3"/></svg>`;

const isIos = () => curPlatform === 'ios';

function navBar(title, actionLabel, backLabel) {
  if (isIos()) {
    return `<div class="navbar" style="justify-content:space-between">
      <span style="font-size:13px;font-weight:600;color:var(--terra);cursor:pointer;min-width:50px" onclick="setScreen('profile')">← Back</span>
      <span class="nav-title">${title}</span>
      <span class="nav-action" style="min-width:50px;text-align:right">${actionLabel||''}</span>
    </div>`;
  } else {
    return `<div class="navbar">
      <div class="nav-back" onclick="setScreen('profile')">
        <svg class="nav-back-svg" viewBox="0 0 16 16"><polyline points="10 4 6 8 10 12"/></svg>
      </div>
      <span class="nav-title">${title}</span>
      ${actionLabel ? `<span class="nav-action">${actionLabel}</span>` : '<span style="width:34px"></span>'}
    </div>`;
  }
}

function bottomNav(active) {
  const items = [{ico:'🏠',lbl:'Home'},{ico:'🔍',lbl:'Search'},{ico:'📋',lbl:'Bookings'},{ico:'🤍',lbl:'Wishlist'},{ico:'👤',lbl:'Profile'}];
  return `<div class="bottom-nav">
    ${items.map(it => `
    <div class="bnav-item${it.lbl===active?' active':''}">
      <span style="font-size:${it.lbl===active?'19':'18'}px">${it.ico}</span>
      <span class="bnav-lbl">${it.lbl}</span>
      ${it.lbl===active?'<div class="bnav-dot"></div>':''}
    </div>`).join('')}
  </div>`;
}

function toggle(on) {
  return `<div class="toggle-wrap"><div class="toggle-track ${on?'on':'off'}"></div><div class="toggle-thumb ${on?'on':'off'}"></div></div>`;
}

const screens = {

  profile() {
    return `

function render(platform, screenId) {
  const el = document.getElementById(platform + '-screen');
  if (el && screens[screenId]) {
    curPlatform = platform;
    el.innerHTML = screens[screenId]();
  }
}

function setScreen(id) {
  curScreen = id;
  document.querySelectorAll('.screen-pills .pill').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick').includes(`'${id}'`));
  });
  render('ios', id);
  render('android', id);
}

function setPlatform(p) {
  curPlatform = p;
  document.getElementById('sw-ios').classList.toggle('active', p==='ios');
  document.getElementById('sw-and').classList.toggle('active', p==='android');
  document.getElementById('ios-col').style.display = p==='ios'?'block':'none';
  document.getElementById('android-col').style.display = p==='android'?'block':'none';
  render(p, curScreen);
}
